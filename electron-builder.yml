appId: com.zhenhua32.knowbook
productName: KnowBook
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**/*
publish:
  - provider: github
    owner: zhenhua32
    repo: knowbook
    releaseType: release
win:
  icon: build/icon.png
  artifactName: KnowBook-${version}-win-${arch}.${ext}
  target:
    - target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.png
  artifactName: KnowBook-${version}-mac-${arch}.${ext}
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
linux:
  icon: build/icon.png
  artifactName: KnowBook-${version}-linux-${arch}.${ext}
  category: Office
  target:
    - target: AppImage