name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Typecheck System Plugin v3 starter examples
        run: npm run typecheck:system-plugin-examples

      - name: Verify Markdown standards and round trips
        run: npm run test:markdown-spec

      - name: Upload Markdown standards report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-spec-report
          path: test-results/markdown-spec-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Run unit and integration tests
        run: npm test

      - name: Check Markdown performance regression ceilings
        run: npm run benchmark:markdown

      - name: Check Markdown link maintenance regression ceilings
        run: npm run benchmark:markdown-links

      - name: Check full Markdown source editing regression ceilings
        run: npm run benchmark:markdown-source

      - name: Upload Markdown performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-quality-report
          path: |
            test-results/markdown-quality-report.json
            test-results/markdown-link-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Build application
        run: npm run build

      - name: Install CJK fonts for desktop acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run Electron E2E tests
        run: xvfb-run --auto-servernum npx playwright test --grep @electron

      - name: Upload Markdown input frame report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-input-frame-report
          path: test-results/markdown-input-frame-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Electron E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-failure
          path: |
            playwright-report/**
            test-results/electron/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Markdown workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-workflow-report
          path: |
            test-results/markdown-workflow-knowbook.json
            test-results/markdown-workflow-knowbook.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Markdown source editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-source-report
          path: |
            test-results/markdown-source-*.json
            test-results/markdown-source-*.png
          if-no-files-found: ignore
          retention-days: 14

  plugin-runtime-security:
    name: System Plugin v3 acceptance (Windows)
    # npm's bundled node-gyp does not recognize the VS 2026 toolchain on windows-latest.
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python for native source compilation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure native builds and Electron download cache
        shell: pwsh
        run: |
          "NODE_GYP_FORCE_PYTHON=$env:pythonLocation\python.exe" >> $env:GITHUB_ENV
          "electron_config_cache=$env:RUNNER_TEMP\electron-cache" >> $env:GITHUB_ENV

      - name: Restore Electron download cache
        id: electron-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-v1-

      - name: Install dependencies
        shell: pwsh
        timeout-minutes: 15
        run: |
          # Electron downloads outside npm's registry, so npm's fetch retries do not cover it.
          $PSNativeCommandUseErrorActionPreference = $false
          $ciInstallAttempts = 3
          $ciTransientFailure = 'HTTPError: Response code (408|429|5\d{2})\b|\bE(408|429|5\d{2}|CONNRESET|CONNREFUSED|TIMEDOUT|AI_AGAIN|HOSTUNREACH|NETUNREACH|SOCKETTIMEDOUT)\b|socket hang up'
          for ($ciInstallAttempt = 1; $ciInstallAttempt -le $ciInstallAttempts; $ciInstallAttempt++) {
            npm ci 2>&1 | Tee-Object -Variable ciInstallOutput
            $ciInstallExitCode = $LASTEXITCODE
            if ($ciInstallExitCode -eq 0) { exit 0 }
            if ($ciInstallAttempt -eq $ciInstallAttempts -or ($ciInstallOutput -join "`n") -notmatch $ciTransientFailure) {
              exit $ciInstallExitCode
            }
            Write-Warning "Dependency download failed temporarily; retrying npm ci ($ciInstallAttempt/$ciInstallAttempts)."
            Start-Sleep -Seconds (10 * $ciInstallAttempt)
          }

      # Save before acceptance tests so a later test failure does not discard the download.
      - name: Save Electron download cache
        if: steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

      - name: Run isolated-realm security tests
        run: npm run test:plugin-security

      - name: Build unpacked application
        run: npm run pack

      - name: Run packaged Electron utility-process probe
        run: npm run test:packaged-runtime-smoke

      - name: Run packaged native System Plugin acceptance
        run: npm run test:packaged-system-plugins

      - name: Run Windows login startup and detached service acceptance
        run: npm run test:packaged-windows-startup

      - name: Run reviewed dependency lifecycle and build acceptance
        run: npm run test:packaged-dependency-scripts

      - name: Prepare pinned pnpm and Yarn Classic toolchain
        run: npm run prepare:package-managers

      - name: Prepare pinned modern Yarn toolchain
        run: npm run prepare:modern-yarn

      - name: Prepare locked modern Yarn native dependency cache
        run: npm run prepare:native-package-managers

      - name: Run packaged pnpm and Yarn Classic acceptance
        run: npm run test:packaged-package-managers

      - name: Run packaged modern Yarn acceptance
        run: npm run test:packaged-modern-yarn

      - name: Run native pnpm and Yarn rebuild matrix
        run: npm run test:packaged-native-package-managers

      - name: Run unified System Plugin capability acceptance
        run: npm run test:packaged-system-capabilities

      - name: Run packaged activation failure and recovery acceptance
        run: npm run test:packaged-activation-recovery

      - name: Run plugin data retention and reinstall acceptance
        run: npm run test:packaged-data-retention

      - name: Run database backup restore and safe startup acceptance
        run: npm run test:packaged-database-restore

      - name: Run interrupted install and exact artifact retry acceptance
        run: npm run test:packaged-install-interruption

      - name: Run packaged application uninstall maintenance acceptance
        run: npm run test:packaged-uninstall-cleanup

      - name: Prepare isolated Electron host upgrade fixture
        run: npm run prepare:host-upgrade

      - name: Run real host ABI upgrade and rollback acceptance
        run: npm run test:packaged-host-upgrade

      - name: Prepare independent NSIS upgrade and rollback installers
        run: npm run prepare:windows-installer

      - name: Run NSIS and updater upgrade rollback and uninstall acceptance
        run: npm run test:packaged-windows-installer

      - name: Upload System Plugin acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-system-plugin-windows
          path: |
            test-results/**
            release/acceptance/**
            release/host-upgrade/fixture.json
            release/windows-installer/fixture.json
          if-no-files-found: ignore
