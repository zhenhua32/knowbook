name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Typecheck System Plugin v3 starter examples
        run: npm run typecheck:system-plugin-examples

      - name: Verify Markdown standards and round trips
        run: npm run test:markdown-spec

      - name: Upload Markdown standards report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-spec-report
          path: test-results/markdown-spec-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Run unit and integration tests
        run: npm test

      - name: Fetch pinned protocol5 v1 exchange source
        run: git fetch --no-tags --depth=1 origin 852fd18d9c842082015ef7359696659a7a866980

      - name: Verify genuine protocol5 v1 exchange recovery compatibility
        run: npm run test:synced-exchange-v1-compat

      - name: Upload protocol5 v1 exchange compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synced-exchange-v1-compat-evidence
          path: |
            test-results/synced-exchange-v1-compat/**
            !test-results/synced-exchange-v1-compat/**/legacy-852fd18/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Fetch pinned protocol5 v2 conflict source
        run: git fetch --no-tags --depth=1 origin 0be1dc11603d2e6850338d6ad7a15d644a7624a8

      - name: Verify genuine protocol5 v2 conflict recovery compatibility
        run: npm run test:synced-exchange-v2-compat

      - name: Upload protocol5 v2 conflict compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synced-exchange-v2-compat-evidence
          path: |
            test-results/synced-exchange-v2-compat/**
            !test-results/synced-exchange-v2-compat/**/legacy-0be1dc1/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Fetch pinned protocol5 v3 both source
        run: git fetch --no-tags --depth=1 origin 58991583bd59c932d242168223ca7b9e5d0cafd0

      - name: Verify genuine protocol5 v3 both recovery compatibility
        run: npm run test:synced-exchange-v3-compat

      - name: Upload protocol5 v3 both compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synced-exchange-v3-compat
          path: |
            test-results/synced-exchange-v3-compat/**
            !test-results/synced-exchange-v3-compat/**/legacy-5899158/**
          if-no-files-found: error
          retention-days: 14

      - name: Fetch pinned protocol5 v4 tombstone source
        run: git fetch --no-tags --depth=1 origin 049c4ac85199c2e00484952b572276824a53b2da

      - name: Verify genuine protocol5 v4 tombstone recovery compatibility
        run: npm run test:synced-exchange-v4-compat

      - name: Upload protocol5 v4 tombstone compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synced-exchange-v4-compat
          path: |
            test-results/synced-exchange-v4-compat/**
            !test-results/synced-exchange-v4-compat/**/legacy-049c4ac/**
          if-no-files-found: error
          retention-days: 14

      - name: Fetch pinned protocol5 v5 and v6 knowledge selection source
        run: git fetch --no-tags --depth=1 origin 9e9bc7d6f135b55bf37604466fe0867396b03a85

      - name: Verify genuine protocol5 v5 and v6 recovery compatibility
        run: npm run test:synced-exchange-v56-compat

      - name: Upload protocol5 v5 and v6 recovery compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synced-exchange-v56-compat
          path: |
            test-results/synced-exchange-v56-compat/**
            !test-results/synced-exchange-v56-compat/**/legacy-9e9bc7d/**
          if-no-files-found: error

      - name: Verify schema27 logical deletion with genuine old Main readers
        run: npm run test:synced-tombstone-legacy-readers

      - name: Upload logical deletion legacy reader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synced-tombstone-legacy-readers
          path: |
            test-results/synced-tombstone-legacy-readers/**
            !test-results/synced-tombstone-legacy-readers/**/legacy-5899158/**
          if-no-files-found: error
          retention-days: 14

      - name: Fetch pinned schema25 backup reader source
        run: git fetch --no-tags --depth=1 origin a62a69807b57375fb7b0e359102244d68795a657

      - name: Verify V3 archive with genuine schema25 backup readers
        run: npm run test:backup-v3-legacy-reader

      - name: Upload V3 backup legacy reader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-v3-compat
          path: |
            test-results/backup-v3-compat/**
            !test-results/backup-v3-compat/**/legacy-a62a698/**
          if-no-files-found: error
          retention-days: 14

      - name: Verify controlled database restore with genuine schema25 backup
        run: npm run test:database-restore-v2-legacy

      - name: Upload controlled database restore legacy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-restore-v2-compat
          path: |
            test-results/database-restore-v2-compat/**
            !test-results/database-restore-v2-compat/**/legacy-a62a698/**
          if-no-files-found: error
          retention-days: 14

      - name: Fetch pinned schema27 recovery boundary reader source
        run: git fetch --no-tags --depth=1 origin 92c4766d551c625ac6e1708331c5697da94a186b

      - name: Verify synced recovery boundary with genuine old schema27 readers
        run: npm run test:synced-recovery-legacy-reader

      - name: Upload synced recovery boundary legacy reader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synced-recovery-legacy-reader-evidence
          path: |
            test-results/rec-legacy/**
            !test-results/rec-legacy/**/old
            !test-results/rec-legacy/**/old/**
          if-no-files-found: error
          retention-days: 14

      - name: Fetch pinned schema26 reader source
        run: git fetch --no-tags --depth=1 origin 6d61134b917d88753bdbc72a5cafe6e3d81fc216

      - name: Verify schema27 migration and actual legacy readers
        run: npm run test:schema27-legacy-readers

      - name: Upload schema27 compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema27-legacy-reader-evidence
          path: |
            test-results/schema27-legacy-readers/**
            !test-results/schema27-legacy-readers/**/legacy-6d61134/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Check Markdown performance regression ceilings
        run: npm run benchmark:markdown

      - name: Check Markdown link maintenance regression ceilings
        run: npm run benchmark:markdown-links

      - name: Check full Markdown source editing regression ceilings
        run: npm run benchmark:markdown-source

      - name: Verify consecutive synced source Apply lineage
        run: npm run benchmark:synced-source -- --output-dir test-results/synced-source-checkpoint-ci

      - name: Upload synced source checkpoint benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synced-source-checkpoint-report
          path: test-results/synced-source-checkpoint-ci/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Markdown performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-quality-report
          path: |
            test-results/markdown-quality-report.json
            test-results/markdown-link-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Build application
        run: npm run build

      - name: Upload built application for desktop acceptance
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-build
          path: out/
          if-no-files-found: error
          retention-days: 1

  electron-e2e:
    name: Electron E2E (shard ${{ matrix.shard }}/4)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Keep every shard's diagnostics when another shard fails.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download validated application build
        uses: actions/download-artifact@v8
        with:
          name: electron-e2e-build
          path: out/

      - name: Install CJK fonts for desktop acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run Electron E2E tests
        # One worker per runner preserves the isolated performance measurements.
        # Failures still fail the job, but stop before exhausting its time budget.
        run: xvfb-run --auto-servernum npx playwright test --grep @electron --workers=1 --shard=${{ matrix.shard }}/4 --max-failures=5

      - name: Upload Markdown input frame report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-input-frame-report-shard-${{ matrix.shard }}
          path: test-results/markdown-input-frame-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Electron E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-evidence-shard-${{ matrix.shard }}
          path: |
            playwright-report/**
            test-results/electron/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Markdown workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-workflow-report-shard-${{ matrix.shard }}
          path: |
            test-results/markdown-workflow-knowbook.json
            test-results/markdown-workflow-knowbook.png
            test-results/markdown-import-report.json
            test-results/markdown-import-report.png
            test-results/markdown-wiki.json
            test-results/markdown-wiki.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Markdown source editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-source-report-shard-${{ matrix.shard }}
          path: |
            test-results/markdown-source-*.json
            test-results/markdown-source-*.png
          if-no-files-found: ignore
          retention-days: 14

  plugin-runtime-security:
    name: System Plugin v3 acceptance (Windows)
    # npm's bundled node-gyp does not recognize the VS 2026 toolchain on windows-latest.
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python for native source compilation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure native builds and Electron download cache
        shell: pwsh
        run: |
          "NODE_GYP_FORCE_PYTHON=$env:pythonLocation\python.exe" >> $env:GITHUB_ENV
          "electron_config_cache=$env:RUNNER_TEMP\electron-cache" >> $env:GITHUB_ENV

      - name: Restore Electron download cache
        id: electron-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-v1-

      - name: Install dependencies
        shell: pwsh
        timeout-minutes: 15
        run: |
          # Electron downloads outside npm's registry, so npm's fetch retries do not cover it.
          $PSNativeCommandUseErrorActionPreference = $false
          $ciInstallAttempts = 3
          $ciTransientFailure = 'HTTPError: Response code (408|429|5\d{2})\b|\bE(408|429|5\d{2}|CONNRESET|CONNREFUSED|TIMEDOUT|AI_AGAIN|HOSTUNREACH|NETUNREACH|SOCKETTIMEDOUT)\b|socket hang up'
          for ($ciInstallAttempt = 1; $ciInstallAttempt -le $ciInstallAttempts; $ciInstallAttempt++) {
            npm ci 2>&1 | Tee-Object -Variable ciInstallOutput
            $ciInstallExitCode = $LASTEXITCODE
            if ($ciInstallExitCode -eq 0) { exit 0 }
            if ($ciInstallAttempt -eq $ciInstallAttempts -or ($ciInstallOutput -join "`n") -notmatch $ciTransientFailure) {
              exit $ciInstallExitCode
            }
            Write-Warning "Dependency download failed temporarily; retrying npm ci ($ciInstallAttempt/$ciInstallAttempts)."
            Start-Sleep -Seconds (10 * $ciInstallAttempt)
          }

      # Save before acceptance tests so a later test failure does not discard the download.
      - name: Save Electron download cache
        if: steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

      - name: Run isolated-realm security tests
        run: npm run test:plugin-security

      - name: Run controlled database restore regression tests
        run: npm run test:database-restore

      - name: Run synced recovery boundary regression tests
        run: npm run test:synced-recovery-boundary

      - name: Build unpacked application
        run: npm run pack

      - name: Run packaged Electron utility-process probe
        run: npm run test:packaged-runtime-smoke

      - name: Run packaged native System Plugin acceptance
        run: npm run test:packaged-system-plugins

      - name: Run Windows login startup and detached service acceptance
        run: npm run test:packaged-windows-startup

      - name: Run reviewed dependency lifecycle and build acceptance
        run: npm run test:packaged-dependency-scripts

      - name: Prepare pinned pnpm and Yarn Classic toolchain
        run: npm run prepare:package-managers

      - name: Prepare pinned modern Yarn toolchain
        run: npm run prepare:modern-yarn

      - name: Prepare locked modern Yarn native dependency cache
        run: npm run prepare:native-package-managers

      - name: Run packaged pnpm and Yarn Classic acceptance
        run: npm run test:packaged-package-managers

      - name: Run packaged modern Yarn acceptance
        run: npm run test:packaged-modern-yarn

      - name: Run native pnpm and Yarn rebuild matrix
        run: npm run test:packaged-native-package-managers

      - name: Run unified System Plugin capability acceptance
        run: npm run test:packaged-system-capabilities

      - name: Run packaged activation failure and recovery acceptance
        run: npm run test:packaged-activation-recovery

      - name: Run plugin data retention and reinstall acceptance
        run: npm run test:packaged-data-retention

      - name: Run database backup restore and safe startup acceptance
        run: npm run test:packaged-database-restore

      - name: Run interrupted install and exact artifact retry acceptance
        run: npm run test:packaged-install-interruption

      - name: Run packaged application uninstall maintenance acceptance
        run: npm run test:packaged-uninstall-cleanup

      - name: Prepare isolated Electron host upgrade fixture
        run: npm run prepare:host-upgrade

      - name: Run real host ABI upgrade and rollback acceptance
        run: npm run test:packaged-host-upgrade

      - name: Prepare independent NSIS upgrade and rollback installers
        run: npm run prepare:windows-installer

      - name: Run NSIS and updater upgrade rollback and uninstall acceptance
        run: npm run test:packaged-windows-installer

      - name: Upload System Plugin acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-system-plugin-windows
          path: |
            test-results/**
            release/acceptance/**
            release/host-upgrade/fixture.json
            release/windows-installer/fixture.json
          if-no-files-found: ignore
