name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Run Electron E2E tests
        run: xvfb-run --auto-servernum npx playwright test --grep @electron

  plugin-runtime-security:
    name: Plugin runtime security (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run isolated-realm security tests
        run: npm run test:plugin-security

      - name: Build unpacked application
        run: npm run pack

      - name: Run packaged Electron utility-process probe (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:packaged-runtime-smoke

      - name: Run packaged Electron utility-process probe
        if: runner.os != 'Linux'
        run: npm run test:packaged-runtime-smoke

      - name: Run packaged native System Plugin acceptance (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:packaged-system-plugins

      - name: Run packaged native System Plugin acceptance
        if: runner.os != 'Linux'
        run: npm run test:packaged-system-plugins

      - name: Upload native System Plugin acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-system-plugin-${{ matrix.os }}
          path: test-results/**
          if-no-files-found: ignore
